# app 은 blue / green 두 벌을 번갈아 띄워 무중단으로 바꾼다. 교체는 deploy/deploy.sh 가 한다.
# 평소에는 한 색만 떠 있고, 어느 색인지는 deploy.state 의 ACTIVE_COLOR 에 남는다.
x-app: &app
  image: ${ECR_REGISTRY}/storix-api:${IMAGE_TAG}
  restart: unless-stopped
  env_file: .env
  environment:
    - SPRING_PROFILES_ACTIVE=${ENV}
    - TZ=Asia/Seoul
  depends_on:
    - cache
  networks:
    - storix-net
  mem_limit: 1536m
  # 진행 중인 요청을 마치고 내려가도록 Spring graceful shutdown 30초보다 길게 둔다
  stop_grace_period: 40s
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "3"

services:
  caddy:
    image: caddy:2.10.0-alpine
    container_name: storix-caddy
    restart: unless-stopped
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
      - "9100:9100"
    volumes:
      # 파일 하나만 마운트하면 upstream.caddy 를 바꿔도 컨테이너가 옛 파일을 본다
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    networks:
      - storix-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  app-blue:
    <<: *app
    container_name: storix-app-blue
    profiles: [blue]

  app-green:
    <<: *app
    container_name: storix-app-green
    profiles: [green]

  batch:
    image: ${ECR_REGISTRY}/storix-batch:${IMAGE_TAG}
    container_name: storix-batch
    restart: unless-stopped
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=${ENV}
      - TZ=Asia/Seoul
    depends_on:
      - cache
    networks:
      - storix-net
    mem_limit: 1024m
    # 스케줄러가 도는 작업을 30초까지 기다리고 내려가도록 그보다 길게 둔다
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  cache:
    image: redis:alpine
    container_name: storix-redis
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 192m
    networks:
      - storix-net

  elasticsearch:
    image: storix-elasticsearch:8.18.8-nori
    build:
      dockerfile_inline: |
        FROM docker.elastic.co/elasticsearch/elasticsearch:8.18.8
        RUN bin/elasticsearch-plugin install --batch analysis-nori
    container_name: storix-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    networks:
      - storix-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: storix-alloy
    restart: unless-stopped
    environment:
      - MONITORING_HOST=${MONITORING_HOST}
      - ENV=${ENV}
      - INSTANCE_ID=${INSTANCE_ID}
      - LOKI_USER=${LOKI_USER}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 128m
    networks:
      - storix-net

volumes:
  alloy-data:
  caddy-config:
  caddy-data:
  es-data:
  redis-data:

networks:
  storix-net:
    driver: bridge
