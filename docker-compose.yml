services:
  app:
    image: ${ECR_REGISTRY}/storix-api:${IMAGE_TAG}
    container_name: storix-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
      - "9100:9100"
    environment:
      - SPRING_PROFILES_ACTIVE=${ENV}
      - TZ=Asia/Seoul
    depends_on:
      - cache
    networks:
      - storix-net
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  batch:
    image: ${ECR_REGISTRY}/storix-batch:${IMAGE_TAG}
    container_name: storix-batch
    restart: unless-stopped
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=${ENV}
      - TZ=Asia/Seoul
    depends_on:
      - cache
    networks:
      - storix-net
    mem_limit: 1024m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  cache:
    image: redis:alpine
    container_name: storix-redis
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 192m
    networks:
      - storix-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: storix-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    networks:
      - storix-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: storix-alloy
    restart: unless-stopped
    environment:
      - MONITORING_HOST=${MONITORING_HOST}
      - ENV=${ENV}
      - INSTANCE_ID=${INSTANCE_ID}
      - LOKI_USER=${LOKI_USER}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 128m
    networks:
      - storix-net

volumes:
  alloy-data:
  es-data:
  redis-data:

networks:
  storix-net:
    driver: bridge
