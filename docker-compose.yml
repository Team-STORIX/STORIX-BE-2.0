services:
  app:
    image: ${ECR_REGISTRY}/storix-api:${IMAGE_TAG}
    container_name: storix-app
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9100:9100"
    environment:
      - SPRING_PROFILES_ACTIVE=${ENV}
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=storix-redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OAUTH_TOKEN_AES_KEY=${OAUTH_TOKEN_AES_KEY}
      - JWT_ACCESS_TOKEN_VALIDITY_MS=${JWT_ACCESS_TOKEN_VALIDITY_MS}
      - JWT_REFRESH_TOKEN_VALIDITY_MS=${JWT_REFRESH_TOKEN_VALIDITY_MS}
      - JWT_ONBOARDING_TOKEN_VALIDITY_MS=${JWT_ONBOARDING_TOKEN_VALIDITY_MS}
      - OAUTH_KAKAO_CLIENT_ID=${KAKAO_AUTH_CLIENT}
      - OAUTH_KAKAO_CLIENT_SECRET=${KAKAO_AUTH_SECRET}
      - OAUTH_KAKAO_ADMIN_KEY=${KAKAO_AUTH_ADMIN}
      - OAUTH_KAKAO_NATIVE_APP_KEY=${KAKAO_AUTH_NATIVE}
      - OAUTH_NAVER_CLIENT_ID=${NAVER_AUTH_CLIENT}
      - OAUTH_NAVER_CLIENT_SECRET=${NAVER_AUTH_SECRET}
      - OAUTH_APPLE_CLIENT_ID=${APPLE_AUTH_CLIENT}
      - OAUTH_APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - OAUTH_APPLE_KEY_ID=${APPLE_KEY_ID}
      - OAUTH_APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
      - OAUTH_X_CLIENT_ID=${X_AUTH_CLIENT}
      - OAUTH_X_CLIENT_SECRET=${X_AUTH_SECRET}
      - TZ=Asia/Seoul
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_CREDENTIALS_ACCESS_KEY=${AWS_CREDENTIALS_ACCESS_KEY}
      - AWS_CREDENTIALS_SECRET_KEY=${AWS_CREDENTIALS_SECRET_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET_NAME}
      - AWS_S3_BASE_URL=${AWS_S3_BASE_URL}
      - SWAGGER_USER=${SWAGGER_USER}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD}
      - ADMIN_IDENTIFIER=${ADMIN_IDENTIFIER}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CREDENTIALS_BASE64=${FIREBASE_CREDENTIALS_BASE64}
      - PORTONE_STORE_ID=${PORTONE_STORE_ID}
      - PORTONE_CHANNEL_KEY=${PORTONE_CHANNEL_KEY}
      - PORTONE_API_SECRET=${PORTONE_API_SECRET}
      - "LOGGING_PATTERN_LEVEL=%5p [trace:%X{traceId:-}]"
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=10MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=10MB
      - SPRING_JPA_OPEN_IN_VIEW=false
      - MANAGEMENT_SERVER_PORT=9100
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
      - MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS=true
      - APP_VERSION_IOS_MIN_SUPPORTED=${APP_VERSION_IOS_MIN_SUPPORTED}
      - APP_VERSION_IOS_LATEST=${APP_VERSION_IOS_LATEST}
      - APP_VERSION_IOS_RELEASE_DATE=${APP_VERSION_IOS_RELEASE_DATE}
      - APP_VERSION_ANDROID_MIN_SUPPORTED=${APP_VERSION_ANDROID_MIN_SUPPORTED}
      - APP_VERSION_ANDROID_LATEST=${APP_VERSION_ANDROID_LATEST}
      - APP_VERSION_ANDROID_RELEASE_DATE=${APP_VERSION_ANDROID_RELEASE_DATE}
    depends_on:
      - cache
    networks:
      - storix-net
    mem_limit: 2048m
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  batch:
    image: ${ECR_REGISTRY}/storix-batch:${IMAGE_TAG}
    container_name: storix-batch
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${ENV}
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=storix-redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OAUTH_TOKEN_AES_KEY=${OAUTH_TOKEN_AES_KEY}
      - JWT_ACCESS_TOKEN_VALIDITY_MS=${JWT_ACCESS_TOKEN_VALIDITY_MS}
      - JWT_REFRESH_TOKEN_VALIDITY_MS=${JWT_REFRESH_TOKEN_VALIDITY_MS}
      - JWT_ONBOARDING_TOKEN_VALIDITY_MS=${JWT_ONBOARDING_TOKEN_VALIDITY_MS}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BASE_URL=${AWS_S3_BASE_URL}
      - AWS_CREDENTIALS_ACCESS_KEY=${AWS_CREDENTIALS_ACCESS_KEY}
      - AWS_CREDENTIALS_SECRET_KEY=${AWS_CREDENTIALS_SECRET_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET_NAME}
      - TZ=Asia/Seoul
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - 'SPRING_APPLICATION_JSON={"spring.jpa.properties.hibernate.jdbc.batch_size":500,"spring.jpa.properties.hibernate.order_updates":true}'
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CREDENTIALS_BASE64=${FIREBASE_CREDENTIALS_BASE64}
      - PORTONE_API_SECRET=${PORTONE_API_SECRET}
    depends_on:
      - cache
    networks:
      - storix-net
    mem_limit: 1024m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  cache:
    image: redis:alpine
    container_name: storix-redis
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 192m
    networks:
      - storix-net

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: storix-alloy
    restart: unless-stopped
    environment:
      - MONITORING_HOST=${MONITORING_HOST}
      - ENV=${ENV}
      - INSTANCE_ID=${INSTANCE_ID}
      - LOKI_USER=${LOKI_USER}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 96m
    networks:
      - storix-net

volumes:
  alloy-data:
  redis-data:

networks:
  storix-net:
    driver: bridge
