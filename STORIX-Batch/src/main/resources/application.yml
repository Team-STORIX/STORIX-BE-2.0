spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_updates: true
  data:
    redis:
      host: storix-redis
      port: 6379

aws:
  credentials:
    access-key: ${AWS_CREDENTIALS_ACCESS_KEY}
    secret-key: ${AWS_CREDENTIALS_SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET_NAME}

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64}

portone:
  api-secret: ${PORTONE_API_SECRET}
