apiVersion: 1

# dev 알림은 Grafana Cloud 가 보낸다 (#439). 여기서는 prod 만 Slack 으로 보낸다
muteTimes:
  - orgId: 1
    name: always
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '24:00'

policies:
  - orgId: 1
    receiver: slack
    group_by: [alertname, env]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: slack
        object_matchers:
          - ['env', '=', 'dev']
        mute_time_intervals: [always]
      - receiver: slack
        object_matchers:
          - ['severity', '=', 'critical']
        repeat_interval: 1h
